name: ESPHome build

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ESPHome
        run: python -m pip install -r requirements.txt

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Cache ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: .esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('foxess-inverter.yaml', 'components/**') }}
          restore-keys: |
            ${{ runner.os }}-esphome-

      - name: Create CI secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-wifi"
          wifi_password: "ci-password"
          esphome_ota_pass: "ci-ota-password"
          esphome_api_encryption_key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          foxess_ap_ssid: "FoxESS Inverter Fallback"
          foxess_ap_pass: "ci-fallback-password"
          EOF

      - name: Validate ESPHome config
        run: esphome config foxess-inverter.yaml

      - name: Compile ESPHome firmware
        run: esphome compile foxess-inverter.yaml
